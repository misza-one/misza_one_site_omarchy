services:
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
    image: miszaone_omarchy_site:latest
    container_name: misza-terminal
    restart: unless-stopped
    ports:
      - "8200:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.misza.project=misza.one"
      - "com.misza.description=Omarchy Terminal Desktop"
